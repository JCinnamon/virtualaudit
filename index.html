<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Street Audit</title>

  <!-- Local dev: copy config.js.example → config.js and fill in your keys.
       GitHub Pages deployment: hardcode MAPS_API_KEY and SHEETS_WEBHOOK_URL directly below.

       NOTE: This version logs each audit module to its own tab in your Google Sheet.
       You must update your Apps Script — see virtualaudit_config_2026-06-11.js.example
       for the new doGet() code (it creates tabs and headers automatically). -->
  <script>
    window.MAPS_API_KEY       = 'AIzaSyBNVN2mixyttHxNeZjX63A96vEMtx0Nmio';
    window.SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbySEzVZDAFZwsRejLIk3cir6g1yApaKqYv8n-XWMHQITq-R0F2sImDuZjLOaGJaFYTI/exec';
  </script>
  <script src="config.js" onerror="void 0"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #2c5f7a;
      --primary-dark:  #1e4258;
      --accent:        #1a9080;
      --accent-hover:  #168070;
      --accent-light:  #e6f4f1;
      --border:        #dde8ed;
      --text:          #1a2b35;
      --text-muted:    #5a7a8a;
      --bg:            #f5f8fa;
      --white:         #ffffff;
      --danger:        #c0392b;
      --warning:       #d35400;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    #app { display: flex; height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: 336px;
      min-width: 336px;
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .sidebar-header {
      background: var(--primary);
      color: white;
      padding: 0.7rem 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header h1 { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.01em; }
    .obs-badge {
      background: var(--accent);
      color: white;
      font-size: 0.69rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      min-width: 24px;
      text-align: center;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      scrollbar-width: thin;
      scrollbar-color: #b8cdd6 transparent;
    }
    .sidebar-body::-webkit-scrollbar { width: 6px; }
    .sidebar-body::-webkit-scrollbar-track { background: transparent; }
    .sidebar-body::-webkit-scrollbar-thumb { background: #b8cdd6; border-radius: 3px; }

    .sidebar-footer {
      background: var(--primary-dark);
      color: rgba(255,255,255,0.5);
      text-align: center;
      font-size: 0.7rem;
      padding: 0.4rem 1rem;
      flex-shrink: 0;
    }
    .sidebar-footer a { color: rgba(255,255,255,0.75); text-decoration: none; }
    .sidebar-footer a:hover { color: #fff; }

    /* ── Sections ─────────────────────────────────────────────── */
    .section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .section-title {
      background: var(--primary);
      color: white;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.28rem 0.65rem;
    }
    .section-body {
      padding: 0.45rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    /* ── Form controls ────────────────────────────────────────── */
    label {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.1rem;
    }
    label .req { color: var(--danger); margin-left: 2px; }
    .field-help { font-size: 0.63rem; color: var(--text-muted); opacity: 0.85; margin-top: 0.08rem; }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,144,128,0.12);
    }
    input.error, select.error, textarea.error {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px rgba(192,57,43,0.1) !important;
    }
    textarea { resize: vertical; min-height: 38px; }
    input[type="text"]:read-only { background: #f0f4f7; color: var(--text-muted); cursor: default; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }

    /* ── Collapsible form groups ──────────────────────────────── */
    .group {
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--white);
      overflow: hidden;
    }
    .group-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary);
      padding: 0.34rem 0.55rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .group-header:hover { background: var(--accent-light); }
    .group-header .caret { color: var(--accent); font-size: 0.7rem; width: 0.7rem; }
    .group-header .group-hint {
      margin-left: auto;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text-muted);
      font-size: 0.62rem;
    }
    .group-content {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.45rem 0.55rem;
      border-top: 1px solid var(--border);
    }

    .subheading {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.15rem;
      margin-top: 0.3rem;
    }
    .subheading:first-child { margin-top: 0; }

    /* ── Buttons ──────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.36rem 0.7rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
      line-height: 1.2;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary  { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover:not(:disabled)  { background: var(--accent-hover); }
    .btn-primary.editing { background: var(--warning); border-color: var(--warning); }
    .btn-primary.editing:hover:not(:disabled) { background: #b34500; }
    .btn-secondary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-secondary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-outline  { background: var(--white); color: var(--primary); border-color: var(--border); }
    .btn-outline:hover:not(:disabled)  { background: var(--accent-light); }
    .btn-danger   { background: var(--white); color: var(--danger); border-color: #e8c5c0; font-size: 0.72rem; padding: 0.22rem 0.45rem; }
    .btn-danger:hover:not(:disabled)   { background: #fdf0ee; }
    .btn-full { width: 100%; }
    .btn-sm { font-size: 0.72rem; padding: 0.24rem 0.5rem; }
    .btn kbd {
      font-family: inherit;
      font-size: 0.6rem;
      background: rgba(255,255,255,0.22);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 400;
    }

    /* ── Edit bar ─────────────────────────────────────────────── */
    #edit-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #fff4e6;
      border: 1px solid #fdd5a0;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      font-size: 0.72rem;
      color: var(--warning);
      font-weight: 500;
    }
    #edit-bar.visible { display: flex; }

    /* ── Search ───────────────────────────────────────────────── */
    #search-row { display: flex; gap: 0.35rem; }
    #address-input { flex: 1; }
    #current-address-display {
      display: none;
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Module bar ───────────────────────────────────────────── */
    .module-desc { font-size: 0.66rem; color: var(--text-muted); line-height: 1.3; }
    .module-row { display: flex; gap: 0.35rem; }
    .module-row select { flex: 1; }

    /* ── Scale buttons (likert / bipolar / confidence) ───────── */
    .scale-row { display: flex; gap: 0.3rem; }
    .scale-btn {
      flex: 1;
      padding: 0.24rem 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--white);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .scale-btn.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
    .scale-btn:hover:not(.active) { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .bipolar-ends {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: var(--text-muted);
      margin-top: 0.08rem;
    }

    /* ── Slider ───────────────────────────────────────────────── */
    .slider-row { display: flex; align-items: center; gap: 0.5rem; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .slider-val {
      min-width: 42px;
      text-align: center;
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 4px;
      padding: 0.12rem 0.2rem;
    }

    /* ── Chips (tags / checkboxes) ────────────────────────────── */
    .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .chip {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--white);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.69rem;
      padding: 0.16rem 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
    .chip:hover:not(.active) { background: var(--accent-light); border-color: var(--accent); }

    /* ── Radio rows ───────────────────────────────────────────── */
    .radio-row { display: flex; flex-direction: column; gap: 0.14rem; }
    .radio-row .radio-opt {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.75rem; color: var(--text); cursor: pointer;
      font-weight: 400; margin: 0;
    }
    .radio-row input[type="radio"] { width: auto; accent-color: var(--accent); }

    /* ── GVI panel ────────────────────────────────────────────── */
    .gvi-panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.45rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .gvi-buttons { display: flex; gap: 0.3rem; }
    .gvi-buttons .btn { flex: 1; }
    .gvi-result {
      font-size: 0.78rem;
      display: none;
      background: var(--accent-light);
      border-radius: 4px;
      padding: 0.3rem 0.5rem;
      color: var(--text);
    }
    .gvi-result strong { color: var(--accent); font-size: 0.95rem; }
    .gvi-status { font-size: 0.67rem; color: var(--text-muted); display: none; }
    .ml-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--text-muted); cursor: pointer; font-weight: 400; margin: 0; }
    .ml-toggle input { width: auto; accent-color: var(--accent); }

    /* ── Info button + collapsible help ───────────────────────── */
    .gvi-toprow { display: flex; align-items: center; gap: 0.4rem; }
    .gvi-toprow .ml-toggle { flex: 1; }
    .info-btn {
      width: 16px; height: 16px; flex-shrink: 0; padding: 0;
      border-radius: 50%; border: 1px solid var(--accent);
      background: var(--white); color: var(--accent);
      font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700;
      font-size: 0.66rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .info-btn:hover, .info-btn.active { background: var(--accent); color: #fff; }
    .gvi-help {
      display: none; font-size: 0.63rem; color: var(--text-muted); line-height: 1.35;
      background: var(--accent-light); border-radius: 4px; padding: 0.35rem 0.45rem;
    }
    .gvi-help.open { display: block; }

    /* ── Composition overlay panel (floats over the map) ──────── */
    .gvi-overlay-panel {
      position: absolute; top: 12px; left: 12px;
      width: 288px; max-width: 44%;
      background: rgba(255,255,255,0.97);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
      z-index: 6; display: none; flex-direction: column; overflow: hidden;
    }
    .gvi-overlay-panel.open { display: flex; }
    .gop-header { display: flex; align-items: center; gap: 0.4rem; background: var(--primary); color: #fff; padding: 0.38rem 0.55rem; }
    .gop-title { font-weight: 600; font-size: 0.72rem; flex: 1; }
    .gop-toggle { display: flex; align-items: center; gap: 0.25rem; font-size: 0.64rem; color: #fff; cursor: pointer; margin: 0; white-space: nowrap; }
    .gop-toggle input { width: auto; accent-color: var(--accent); }
    .gop-btn { background: rgba(255,255,255,0.22); border: none; color: #fff; cursor: pointer; border-radius: 3px; width: 19px; height: 19px; line-height: 1; font-size: 0.82rem; padding: 0; }
    .gop-btn:hover { background: rgba(255,255,255,0.4); }
    .gop-legend { display: flex; gap: 0.55rem; flex-wrap: wrap; padding: 0.3rem 0.55rem; color: var(--text-muted); font-size: 0.62rem; border-bottom: 1px solid var(--border); }
    .gop-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 3px; vertical-align: middle; border: 1px solid rgba(0,0,0,0.15); }
    .gop-body { padding: 0.4rem 0.55rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; overflow-y: auto; max-height: 46vh; }
    .gop-body.collapsed { display: none; }
    .gop-body figure { margin: 0; cursor: zoom-in; display: flex; flex-direction: column; gap: 0.1rem; }
    .gop-body img { width: 100%; display: block; border-radius: 4px; border: 1px solid var(--border); }
    .gop-body figcaption { font-size: 0.58rem; color: var(--text-muted); text-align: center; }
    .gop-summary { padding: 0.34rem 0.55rem; border-top: 1px solid var(--border); font-size: 0.68rem; color: var(--text); }
    .gop-summary strong { color: var(--accent); }
    .gop-summary.collapsed { display: none; }

    /* ── Lightbox (enlarged overlay image) ────────────────────── */
    .gvi-lightbox {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10,20,25,0.86);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 0.7rem; cursor: zoom-out;
    }
    .gvi-lightbox.open { display: flex; }
    .gvi-lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.55); cursor: default; }
    .lb-controls { display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap; max-width: 92vw; }
    .lb-cap { color: #fff; font-size: 0.82rem; }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1;
      padding: 0.4rem;
      border: none;
      background: var(--bg);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--white); }
    .tab-btn:hover:not(.active) { background: var(--accent-light); }
    .tab-panel { display: none; }
    .tab-panel.active { display: flex; flex-direction: column; gap: 0.35rem; }

    /* ── Observations list ────────────────────────────────────── */
    .obs-controls { display: flex; gap: 0.3rem; }
    .obs-controls .btn { flex: 1; }
    .obs-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .obs-item {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.45rem 0.55rem;
      cursor: default;
      transition: border-color 0.15s;
    }
    .obs-item:hover { border-color: var(--accent); }
    .obs-module {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 3px;
      padding: 0.06rem 0.35rem;
      margin-bottom: 0.18rem;
    }
    .obs-feature  { font-weight: 600; font-size: 0.8rem; }
    .obs-change   { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.06rem; }
    .obs-meta     { font-size: 0.66rem; color: var(--text-muted); margin-top: 0.1rem; }
    .obs-actions  { display: flex; gap: 0.3rem; justify-content: flex-end; margin-top: 0.3rem; }
    .obs-empty    { text-align: center; color: var(--text-muted); font-size: 0.78rem; padding: 0.9rem 0; }

    /* ── Toasts ───────────────────────────────────────────────── */
    #toasts {
      position: fixed;
      bottom: 20px;
      left: 352px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .toast {
      padding: 9px 16px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      color: white;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
      animation: toastIn 0.18s ease;
      max-width: 320px;
    }
    .toast.success { background: var(--accent); }
    .toast.error   { background: var(--danger); }
    .toast.info    { background: var(--primary); }
    .toast.warning { background: var(--warning); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Modal (module manager) ───────────────────────────────── */
    #modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(20,40,50,0.45);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #modal-backdrop.open { display: flex; }
    #modal {
      background: var(--white);
      border-radius: 8px;
      width: 560px;
      max-width: 94vw;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    #modal-header {
      background: var(--primary);
      color: white;
      padding: 0.7rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #modal-close { background: none; border: none; color: white; font-size: 1.1rem; cursor: pointer; line-height: 1; }
    #modal-body { padding: 0.8rem 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; }

    .mod-list-item {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.5rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .mod-list-item .mod-name { font-weight: 600; font-size: 0.82rem; }
    .mod-list-item .mod-sub  { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.05rem; }
    .mod-badge {
      font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
      background: var(--accent-light); color: var(--accent);
      border-radius: 3px; padding: 0.1rem 0.35rem;
    }
    .mod-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }

    .field-editor-row {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.5rem;
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 0.35rem;
      background: var(--bg);
    }
    .field-editor-row .full { grid-column: 1 / -1; }
    .fe-foot { display: flex; justify-content: space-between; align-items: center; grid-column: 1 / -1; }
    .fe-req { display: flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; color: var(--text-muted); margin: 0; font-weight: 400; }
    .fe-req input { width: auto; }

    /* ── Map area ─────────────────────────────────────────────── */

<script>

// ================================================================
// localStorage — observations (with migration from v1/v2)
// ================================================================
function loadObs() {
  try {
    const v3 = localStorage.getItem(STORAGE_KEY);
    if (v3) return JSON.parse(v3);

    // Migrate v1/v2 flat urban-change records into v3 module format
    const legacyRaw = localStorage.getItem(LEGACY_KEY_V2) || localStorage.getItem(LEGACY_KEY_V1);
    if (legacyRaw) {
      const old = JSON.parse(legacyRaw);
      const migrated = old.map(o => ({
        id:        o.id || Date.now().toString() + Math.random().toString(36).slice(2, 6),
        timestamp: o.timestamp,
        module:    'urban-change',
        observer:  o.observer || '',
        confidence: o.confidence || 3,
        notes:     o.notes || '',
        lat: o.lat, lng: o.lng, heading: o.heading, pitch: o.pitch, zoom: o.zoom || '',
        imageDate: o.imageDate || '', backupDate: o.backupDate || '',
        streetAddress: o.streetAddress || '',
        data: {
          feature:       o.feature       || '',
          featurechange: o.featurechange || '',
          estyear:       o.estyear       || '',
          explanation:   o.explanation   || '',
        },
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }
    return [];
  } catch (e) { return []; }
}

function persistObs() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(observations)); } catch (e) {}
}

// ================================================================
// Custom modules + custom select options
// ================================================================
function loadCustomModules() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_MODULES_KEY)) || []; } catch (e) { return []; }
}
function saveCustomModules(mods) {
  try { localStorage.setItem(CUSTOM_MODULES_KEY, JSON.stringify(mods)); } catch (e) {}
}
function getAllModules() {
  return [...BUILTIN_MODULES, ...loadCustomModules()];
}
function getModule(id) {
  return getAllModules().find(m => m.id === id) || BUILTIN_MODULES[0];
}

function loadCustomOptions() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_OPTIONS_KEY)) || {}; } catch (e) { return {}; }
}
function addCustomOption(key, option) {
  const all = loadCustomOptions();
  all[key] = all[key] || [];
  if (!all[key].includes(option)) all[key].push(option);
  try { localStorage.setItem(CUSTOM_OPTIONS_KEY, JSON.stringify(all)); } catch (e) {}
}
function getOptionsFor(moduleId, field) {
  const extra = loadCustomOptions()[moduleId + '.' + field.id] || [];
  return [...(field.options || []), ...extra];
}

// ================================================================
// Collapsible group state
// ================================================================
function loadGroupState() {
  try { return JSON.parse(localStorage.getItem(GROUP_STATE_KEY)) || {}; } catch (e) { return {}; }
}
function saveGroupState(state) {
  try { localStorage.setItem(GROUP_STATE_KEY, JSON.stringify(state)); } catch (e) {}
}
function groupOpen(moduleId, slug, defaultOpen) {
  const s = loadGroupState()[moduleId + '.' + slug];
  return s === undefined ? defaultOpen : !!s;
}
function setGroupOpen(moduleId, slug, open) {
  const state = loadGroupState();
  state[moduleId + '.' + slug] = open ? 1 : 0;
  saveGroupState(state);
}
function toggleGroup(moduleId, slug, headerBtn) {
  const content = headerBtn.nextElementSibling;
  const open = content.style.display === 'none';
  content.style.display = open ? 'flex' : 'none';
  const caret = headerBtn.querySelector('.caret');
  if (caret) caret.textContent = open ? '▾' : '▸';
  setGroupOpen(moduleId, slug, open);
}
function expandGroupOf(el) {
  const gc = el.closest ? el.closest('.group-content') : null;
  if (gc && gc.style.display === 'none') {
    gc.style.display = 'flex';
    const hdr = gc.previousElementSibling;
    const caret = hdr ? hdr.querySelector('.caret') : null;
    if (caret) caret.textContent = '▾';
  }
}

// ================================================================
// Escaping
// ================================================================
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }

// ================================================================
// Toasts
// ================================================================
function showToast(msg, type = 'info') {
  const div = document.createElement('div');
  div.className = `toast ${type}`;
  div.textContent = msg;
  document.getElementById('toasts').appendChild(div);
  setTimeout(() => div.remove(), 2800);
}

// ================================================================
// Field rendering
// ================================================================
function fieldHtml(moduleId, f) {
  const req  = f.required ? ' <span class="req">*</span>' : '';
  const help = f.help ? `<div class="field-help">${esc(f.help)}</div>` : '';
  let inner = '';

  switch (f.type) {
    case 'text':
      inner = `<label>${esc(f.label)}${req}</label>
        <input type="text" data-fid="${escAttr(f.id)}" placeholder="${escAttr(f.placeholder || '')}" />`;
      break;

    case 'number':
      inner = `<label>${esc(f.label)}${req}</label>
        <input type="number" data-fid="${escAttr(f.id)}" placeholder="${escAttr(f.placeholder || '')}"
          ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} />`;
      break;

    case 'textarea':
      inner = `<label>${esc(f.label)}${req}</label>
        <textarea data-fid="${escAttr(f.id)}" rows="${f.rows || 2}" placeholder="${escAttr(f.placeholder || '')}"></textarea>`;
      break;

    case 'select':
      inner = `<label>${esc(f.label)}${req}</label>
        <select data-fid="${escAttr(f.id)}">
          <option value="">— Select —</option>
          ${(f.options || []).map(o => `<option value="${escAttr(o)}">${esc(o)}</option>`).join('')}
        </select>`;
      break;

    case 'selectx': {
      const opts = getOptionsFor(moduleId, f);
      inner = `<label>${esc(f.label)}${req}</label>
        <div style="display:flex;gap:0.35rem">
          <select data-fid="${escAttr(f.id)}" style="flex:1">
            <option value="">— Select —</option>
            ${opts.map(o => `<option value="${escAttr(o)}">${esc(o)}</option>`).join('')}
          </select>
          <button type="button" class="btn btn-outline btn-sm" onclick="promptAddOption('${escAttr(moduleId)}','${escAttr(f.id)}')">+ Add</button>
        </div>`;
      break;
    }

    case 'radio':
      inner = `<label>${esc(f.label)}${req}</label>
        <div class="radio-row" data-fid="${escAttr(f.id)}">
          ${(f.options || []).map(o => `
            <label class="radio-opt">
              <input type="radio" name="radio-${escAttr(moduleId)}-${escAttr(f.id)}" value="${escAttr(o)}" /> ${esc(o)}
            </label>`).join('')}
        </div>`;
      break;

    case 'slider': {
      const v = f.value != null ? f.value : (f.min || 0);
      inner = `<label>${esc(f.label)}${req}</label>
        <div class="slider-row">
          <input type="range" data-fid="${escAttr(f.id)}" min="${f.min || 0}" max="${f.max || 100}"
            step="${f.step || 1}" value="${v}"
            oninput="this.parentElement.querySelector('.slider-val').textContent = this.value + '%'" />
          <span class="slider-val">${v}%</span>
        </div>`;
      break;
    }

    case 'likert':
      inner = `<label>${esc(f.label)}${req}</label>
        <div class="scale-row" data-fid="${escAttr(f.id)}" data-scale="1">
          ${[1,2,3,4,5].map(n => `<button type="button" class="scale-btn" onclick="scaleClick(this,${n})">${n}</button>`).join('')}
        </div>`;
      break;

    case 'bipolar':
      inner = `<label>${esc(f.label)}${req}</label>
        <div class="scale-row" data-fid="${escAttr(f.id)}" data-scale="1">
          ${[1,2,3,4,5].map(n => `<button type="button" class="scale-btn" onclick="scaleClick(this,${n})">${n}</button>`).join('')}
        </div>
        <div class="bipolar-ends"><span>← ${esc((f.options || [])[0] || '')}</span><span>${esc((f.options || [])[1] || '')} →</span></div>`;
      break;

    case 'checks':
    case 'tags':
      inner = `<label>${esc(f.label)}${req}</label>
        <div class="chips" data-fid="${escAttr(f.id)}">
          ${(f.options || []).map(o => `
            <button type="button" class="chip" data-val="${escAttr(o)}" onclick="this.classList.toggle('active')">${esc(o)}</button>`).join('')}
        </div>`;
      break;

    case 'gvi':
      inner = `
        <div class="gvi-panel" data-fid="${escAttr(f.id)}">
          <div class="gvi-toprow">
            <label class="ml-toggle"><input type="checkbox" id="gvi-ml-toggle" />
              Use ML segmentation (slower, more accurate)</label>
            ${f.help ? `<button type="button" class="info-btn" title="How this works" aria-label="How this works" onclick="toggleGviHelp(this)">i</button>` : ''}
          </div>
          ${f.help ? `<div class="gvi-help" id="gvi-help">${esc(f.help)}</div>` : ''}
          <div class="gvi-buttons">
            <button type="button" class="btn btn-secondary btn-sm" onclick="calcGvi('view')">This view</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="calcGvi('avg')">4-heading avg</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="calcGvi('total360')">360° total</button>
          </div>
          <div class="gvi-status" id="gvi-status"></div>
          <div class="gvi-result" id="gvi-result"></div>
        </div>`;
      return `<div>${inner}</div>`;

    default:
      inner = `<label>${esc(f.label)}</label>
        <input type="text" data-fid="${escAttr(f.id)}" />`;
  }
  return `<div>${inner}${help}</div>`;
}

// Fill-up scale selection (all buttons ≤ value light up)
function scaleClick(btn, val) {
  const row = btn.parentElement;
  row.querySelectorAll('.scale-btn').forEach((b, i) => b.classList.toggle('active', i + 1 <= val));
  row.dataset.value = val;
}

function promptAddOption(moduleId, fieldId) {
  const name = prompt('New option label:');
  if (!name || !name.trim()) return;
  addCustomOption(moduleId + '.' + fieldId, name.trim());
  const sel = document.querySelector(`#module-form select[data-fid="${fieldId}"]`);
  if (sel) {
    const opt = document.createElement('option');
    opt.value = name.trim();
    opt.textContent = name.trim();
    sel.appendChild(opt);
    sel.value = name.trim();
  }
  showToast(`Option “${name.trim()}” added`, 'success');
}

// Render the module form (with collapsible groups)
// ================================================================
function renderModuleSelect() {
  const sel = document.getElementById('module-select');
  sel.innerHTML = getAllModules()
    .map(m => `<option value="${escAttr(m.id)}" ${m.id === currentModuleId ? 'selected' : ''}>${esc(m.name)}</option>`)
    .join('');
}

function selectModule(id) {
  currentModuleId = id;
  if (editingId) cancelEdit();
  if (typeof gopClose === 'function') gopClose(); // hide stale overlay panel
  renderForm();
}

function renderForm() {
  const mod  = getModule(currentModuleId);
  const root = document.getElementById('module-form');
  document.getElementById('module-desc').textContent = mod.description || '';

  let html = '';
  let inGroup = false;
  for (const f of mod.fields) {
    if (f.section) {
      if (inGroup) html += '</div></div>';
      const slug = slugify(f.section);
      const open = groupOpen(mod.id, slug, !f.collapsed);
      html += `<div class="group" data-group="${escAttr(slug)}">
        <button type="button" class="group-header" onclick="toggleGroup('${escAttr(mod.id)}','${escAttr(slug)}',this)">
          <span class="caret">${open ? '▾' : '▸'}</span>${esc(f.section)}
          ${f.sectionHint ? `<span class="group-hint">${esc(f.sectionHint)}</span>` : ''}
        </button>
        <div class="group-content" style="display:${open ? 'flex' : 'none'}">`;
      inGroup = true;
    }
    html += fieldHtml(mod.id, f);
  }
  if (inGroup) html += '</div></div>';

  root.innerHTML = html;
  root.style.display = 'flex';
  root.style.flexDirection = 'column';
  root.style.gap = '0.35rem';
  gviState = { green: '', sky: '', built: '', mode: '', method: '', detail: '' };
}

// ================================================================
// Collect / set field values
// ================================================================
function collectFields(mod) {
  const root = document.getElementById('module-form');
  const data = {};
  for (const f of mod.fields) {
    switch (f.type) {
      case 'text': case 'number': case 'textarea': case 'select': case 'selectx': {
        const el = root.querySelector(`[data-fid="${f.id}"]`);
        data[f.id] = el ? el.value.trim() : '';
        break;
      }
      case 'radio': {
        const checked = root.querySelector(`[data-fid="${f.id}"] input:checked`);
        data[f.id] = checked ? checked.value : '';
        break;
      }
      case 'slider': {
        const el = root.querySelector(`[data-fid="${f.id}"]`);
        data[f.id] = el ? Number(el.value) : '';
        break;
      }
      case 'likert': case 'bipolar': {
        const row = root.querySelector(`[data-fid="${f.id}"]`);
        data[f.id] = row && row.dataset.value ? Number(row.dataset.value) : '';
        break;
      }
      case 'checks': case 'tags': {
        const chips = root.querySelectorAll(`[data-fid="${f.id}"] .chip.active`);
        data[f.id] = Array.from(chips).map(c => c.dataset.val);
        break;
      }
      case 'gvi': {
        data.green_view_pct = gviState.green;
        data.sky_view_pct   = gviState.sky;
        data.built_view_pct = gviState.built;
        data.calc_mode      = gviState.mode;
        data.calc_method    = gviState.method;
        data.calc_detail    = gviState.detail;
        break;
      }
    }
  }
  return data;
}

function setFields(mod, data) {
  const root = document.getElementById('module-form');
  for (const f of mod.fields) {
    const v = data[f.id];
    const hasValue = !(v == null || v === '' || (Array.isArray(v) && !v.length));
    switch (f.type) {
      case 'text': case 'number': case 'textarea': case 'select': case 'selectx': {
        const el = root.querySelector(`[data-fid="${f.id}"]`);
        if (el) {
          el.value = v != null ? v : '';
          if (hasValue) expandGroupOf(el);
        }
        break;
      }
      case 'radio': {
        const wrap = root.querySelector(`[data-fid="${f.id}"]`);
        if (wrap) {
          wrap.querySelectorAll('input').forEach(i => { i.checked = (i.value === v); });
          if (hasValue) expandGroupOf(wrap);
        }
        break;
      }
      case 'slider': {
        const el = root.querySelector(`[data-fid="${f.id}"]`);
        if (el) {
          el.value = v != null && v !== '' ? v : (f.min || 0);
          const sv = el.parentElement.querySelector('.slider-val');
          if (sv) sv.textContent = el.value + '%';
        }
        break;
      }
      case 'likert': case 'bipolar': {
        const row = root.querySelector(`[data-fid="${f.id}"]`);
        if (row) {
          row.querySelectorAll('.scale-btn').forEach((b, i) => b.classList.toggle('active', v && i + 1 <= v));
          if (v) { row.dataset.value = v; expandGroupOf(row); } else delete row.dataset.value;
        }
        break;
      }
      case 'checks': case 'tags': {
        const arr = Array.isArray(v) ? v : String(v || '').split('; ').filter(Boolean);
        const wrap = root.querySelector(`[data-fid="${f.id}"]`);
        if (wrap) {
          wrap.querySelectorAll('.chip').forEach(c =>
            c.classList.toggle('active', arr.includes(c.dataset.val)));
          if (arr.length) expandGroupOf(wrap);
        }
        break;
      }
      case 'gvi': {
        // Read new clean keys; fall back to legacy keys for older records.
        const pick = (a, b) => (a != null && a !== '') ? a : (b != null ? b : '');
        gviState = {
          green:  pick(data.green_view_pct, data.gviGreen != null ? data.gviGreen : data.gviAuto),
          sky:    pick(data.sky_view_pct,   data.gviSky),
          built:  pick(data.built_view_pct, data.gviBuilt),
          mode:   data.calc_mode   || data.gviMode   || '',
          method: data.calc_method || data.gviMethod || '',
          detail: data.calc_detail || data.gviDetail || '',
        };
        if (gviState.green !== '' && gviState.green != null) showGviResult();
        break;
      }
    }
  }
}

function validateRequired(mod, data) {
  let firstError = null;
  const root = document.getElementById('module-form');
  for (const f of mod.fields) {
    const el = root.querySelector(`[data-fid="${f.id}"]`);
    const empty = f.required && (data[f.id] === '' || data[f.id] == null ||
      (Array.isArray(data[f.id]) && !data[f.id].length));
    if (el && el.classList) el.classList.toggle('error', !!empty);
    if (empty && el) expandGroupOf(el);
    if (empty && !firstError) firstError = f.label;
  }
  return firstError ? `“${firstError}” is required` : null;
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

let mlModelPromise = null;
function getMlModel() {
  if (!mlModelPromise) {
    mlModelPromise = (async () => {
      gviStatus('Loading TensorFlow.js…');
      await loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js');
      gviStatus('Loading DeepLab model (~9 MB, first use only)…');
      await loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow-models/deeplab@0.2.1/dist/deeplab.min.js');
      const model = await deeplab.load({ base: 'ade20k', quantizationBytes: 2 });
      return model;
    })().catch(err => { mlModelPromise = null; throw err; });
  }
  return mlModelPromise;
}

function fetchPanoImage(panoId, heading, pitch, fov) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => resolve(img);
    img.onerror = () => reject(new Error('Street View Static API image failed to load (check key / Static API enabled).'));
    img.src = 'https://maps.googleapis.com/maps/api/streetview'
      + `?size=640x640&pano=${encodeURIComponent(panoId)}`
      + `&heading=${Math.round(heading)}&pitch=${Math.round(pitch)}&fov=${fov}`
      + `&key=${encodeURIComponent(window.MAPS_API_KEY || '')}`;
  });
}

// Pixel-based classification → returns raw pixel counts {green, sky, total}
// so multiple views can be pooled by summing counts.
//   green: excess-green threshold (after Li et al. 2015)
//   sky:   bright blue OR bright near-white/grey (overcast) pixels
// Overlay mask colours (RGB) — semantic: vegetation green, sky blue, built grey.
// Masks are washed over a desaturated (grayscale) base so the class colour
// stands out against the real scene (e.g. green wash over grey foliage).
const OVL_GREEN = [46, 160, 67];
const OVL_SKY   = [64, 132, 210];
const OVL_BUILT = [140, 140, 140];
const OVL_ALPHA = 0.55;
// Class ids used in the per-pixel classMap: 0 = built, 1 = vegetation, 2 = sky
const OVL_COLORS = [OVL_BUILT, OVL_GREEN, OVL_SKY];
function maskPixel(d, i, C) {
  const gray = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
  d[i]     = gray * (1 - OVL_ALPHA) + C[0] * OVL_ALPHA;
  d[i + 1] = gray * (1 - OVL_ALPHA) + C[1] * OVL_ALPHA;
  d[i + 2] = gray * (1 - OVL_ALPHA) + C[2] * OVL_ALPHA;
}

function classifyPixelCounts(img, wantPreview) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const orig = ctx.getImageData(0, 0, w, h);
  const d = orig.data;
  const origUrl = wantPreview ? c.toDataURL('image/jpeg', 0.7) : '';
  const classMap = wantPreview ? new Uint8Array(w * h) : null;
  let green = 0, sky = 0, total = 0;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    total++;
    let cls = 0; // built (remainder)
    if (g > r && g > b && (2 * g - r - b) >= 24 && g >= 40) {
      green++; cls = 1;
    } else if ((b >= 110 && b >= r && b >= g - 10) || (r >= 190 && g >= 190 && b >= 195)) {
      sky++; cls = 2;
    }
    if (classMap) classMap[p] = cls;
  }
  let maskUrl = '';
  if (wantPreview) {
    const comp = ctx.createImageData(w, h);
    comp.data.set(orig.data);
    const cd = comp.data;
    for (let p = 0; p < classMap.length; p++) maskPixel(cd, p * 4, OVL_COLORS[classMap[p]]);
    ctx.putImageData(comp, 0, 0);
    maskUrl = c.toDataURL('image/jpeg', 0.7);
  }
  return { green, sky, total, maskUrl, origUrl, classMap, w, h };
}

// ML classification → returns pixel counts {green, sky, total} from DeepLab
// ADE20K segmentation. Built environment is the remainder (total − green − sky).
const VEG_LABEL_PATTERNS = ['tree', 'grass', 'plant', 'palm', 'flower', 'field', 'hedge'];
const SKY_LABEL_PATTERNS = ['sky'];
async function classifyMlCounts(img, wantPreview) {
  const model = await getMlModel();
  gviStatus('Segmenting image…');
  const out = await model.segment(img);
  const vegColors = new Set(), skyColors = new Set();
  for (const [label, rgb] of Object.entries(out.legend || {})) {
    const l = label.toLowerCase();
    const key = rgb.join(',');
    if (VEG_LABEL_PATTERNS.some(p => l.includes(p))) vegColors.add(key);
    else if (SKY_LABEL_PATTERNS.some(p => l.includes(p))) skyColors.add(key);
  }
  const sm = out.segmentationMap;
  let green = 0, sky = 0, total = 0;
  for (let i = 0; i < sm.length; i += 4) {
    total++;
    const key = sm[i] + ',' + sm[i + 1] + ',' + sm[i + 2];
    if (vegColors.has(key)) green++;
    else if (skyColors.has(key)) sky++;
  }
  let maskUrl = '', origUrl = '', classMap = null;
  const w = img.naturalWidth, h = img.naturalHeight;
  if (wantPreview) {
    const p = buildMlPreview(img, out, vegColors, skyColors);
    maskUrl = p.maskUrl; origUrl = p.origUrl; classMap = p.classMap;
  }
  return { green, sky, total, maskUrl, origUrl, classMap, w, h };
}

// Composite a desaturated copy of the image with veg/sky/built mask colours
// from the segmentation map. Handles a segmentation map sized differently
// from the source image. Returns both the mask and the plain original.
function buildMlPreview(img, out, vegColors, skyColors) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const imgData = ctx.getImageData(0, 0, W, H);
  const d = imgData.data;
  const origUrl = c.toDataURL('image/jpeg', 0.7);
  const classMap = new Uint8Array(W * H);
  const sm = out.segmentationMap;
  const smW = out.width || W, smH = out.height || H;
  for (let y = 0; y < H; y++) {
    const sy = (smH === H) ? y : Math.floor(y * smH / H);
    for (let x = 0; x < W; x++) {
      const sx = (smW === W) ? x : Math.floor(x * smW / W);
      const si = (sy * smW + sx) * 4;
      const key = sm[si] + ',' + sm[si + 1] + ',' + sm[si + 2];
      const p = y * W + x;
      const cls = vegColors.has(key) ? 1 : (skyColors.has(key) ? 2 : 0);
      classMap[p] = cls;
      maskPixel(d, p * 4, OVL_COLORS[cls]);
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return { maskUrl: c.toDataURL('image/jpeg', 0.7), origUrl, classMap };
}

// Convert pooled counts → {green, sky, built} percentages (built = remainder)
function pctFromCounts(counts) {
  const t = counts.total || 1;
  const green = 100 * counts.green / t;
  const sky   = 100 * counts.sky   / t;
  const built = Math.max(0, 100 - green - sky);
  return { green, sky, built };
}

async function calcGvi(mode) {
  if (!panorama) { gviStatus('Panorama not ready.'); return; }
  const panoId = panorama.getPano();
  if (!panoId) { gviStatus('Navigate to a Street View location first.'); return; }

  const useML      = document.getElementById('gvi-ml-toggle')?.checked;
  const classify   = useML ? classifyMlCounts : (img, wp) => Promise.resolve(classifyPixelCounts(img, wp));
  const methodBase = useML ? 'ML segmentation (DeepLab ADE20K)' : 'Pixel classification';
  const fov = 90;
  const round1 = x => Math.round(x * 10) / 10;
  const previews = [];
  gopShowMask = true;
  gviPanelLoading(); // open the overlay panel in a loading state

  try {
    let res, detail, modeLabel;

    if (mode === 'view') {
      const pov = panorama.getPov();
      gviStatus('Fetching current view…');
      const img = await fetchPanoImage(panoId, pov.heading, pov.pitch, fov);
      const c = await classify(img, true);
      res = pctFromCounts(c);
      previews.push({ label: 'Current view', mask: c.maskUrl, orig: c.origUrl, pct: res, srcImg: img, classMap: c.classMap, w: c.w, h: c.h });
      modeLabel = 'current view';
      detail = `pano ${panoId} · heading ${Math.round(pov.heading)}° · pitch ${Math.round(pov.pitch)}° · fov ${fov}°`;

    } else if (mode === 'avg') {
      // Mean of each index across the 4 cardinal horizon views
      const headings = [0, 90, 180, 270];
      const names    = ['N (0°)', 'E (90°)', 'S (180°)', 'W (270°)'];
      const per = [];
      for (let k = 0; k < headings.length; k++) {
        gviStatus(`Fetching heading ${headings[k]}°…`);
        const img = await fetchPanoImage(panoId, headings[k], 0, fov);
        const c = await classify(img, true);
        const pv = pctFromCounts(c);
        per.push(pv);
        previews.push({ label: names[k], mask: c.maskUrl, orig: c.origUrl, pct: pv, srcImg: img, classMap: c.classMap, w: c.w, h: c.h });
      }
      res = {
        green: per.reduce((a, p) => a + p.green, 0) / per.length,
        sky:   per.reduce((a, p) => a + p.sky,   0) / per.length,
        built: per.reduce((a, p) => a + p.built, 0) / per.length,
      };
      modeLabel = '4-heading avg';
      detail = 'pano ' + panoId + ' · headings ' + headings.join('/') + '° · pitch 0° · fov ' + fov
             + '° · green ' + headings.map((h, i) => per[i].green.toFixed(0) + '%').join('/');

    } else { // total360 — full sphere, pixels pooled into one denominator
      const samples = [
        { h: 0, p: 0, n: 'N' }, { h: 90, p: 0, n: 'E' }, { h: 180, p: 0, n: 'S' }, { h: 270, p: 0, n: 'W' },
        { h: 0, p: 90, n: 'Up' }, { h: 0, p: -90, n: 'Down' },
      ];
      const acc = { green: 0, sky: 0, total: 0 };
      let n = 0;
      for (const s of samples) {
        n++;
        gviStatus(`Fetching 360° sample ${n}/${samples.length}…`);
        const img = await fetchPanoImage(panoId, s.h, s.p, fov);
        const c = await classify(img, true);
        acc.green += c.green; acc.sky += c.sky; acc.total += c.total;
        previews.push({ label: s.n, mask: c.maskUrl, orig: c.origUrl, pct: pctFromCounts(c), srcImg: img, classMap: c.classMap, w: c.w, h: c.h });
      }
      res = pctFromCounts(acc);
      modeLabel = '360° total (pooled)';
      detail = 'pano ' + panoId + ' · 6-view sphere (N/E/S/W + up + down) · fov ' + fov + '° · pooled pixels';
    }

    gviState = {
      green: round1(res.green), sky: round1(res.sky), built: round1(res.built),
      mode:  modeLabel, method: methodBase + ' · ' + modeLabel, detail,
    };
    gviStatus('');
    showGviResult();
    const summary = `Green <strong>${gviState.green}%</strong> · Sky <strong>${gviState.sky}%</strong> · Built <strong>${gviState.built}%</strong>
      <div style="font-size:0.6rem;color:var(--text-muted);margin-top:0.1rem">${esc(gviState.method)}</div>`;
    renderGviPanel(previews, summary);
    showToast(`Computed: green ${gviState.green}% · sky ${gviState.sky}% · built ${gviState.built}%`, 'success');
  } catch (err) {
    gviStatus('Error: ' + err.message);
    gviPanelError(err.message);
    showToast('Calculation failed', 'error');
  }
}

function gviPanelLoading() {

function renderGviPanel(items, summaryHtml) {

  body.style.gridTemplateColumns = gviPreviewItems.length === 1 ? '1fr' : '1fr 1fr';
  const key = gopShowMask ? 'mask' : 'orig';
  body.innerHTML = gviPreviewItems.map((it, idx) => `
    <figure onclick="openGviLightbox(${idx})" title="Click to enlarge">
      <img src="${it[key] || it.mask || it.orig}" alt="${escAttr(it.label)}" loading="lazy" />
      <figcaption>${esc(it.label)}${it.pct
        ? ` · G${Math.round(it.pct.green)} S${Math.round(it.pct.sky)} B${Math.round(it.pct.built)}`
        : ''}</figcaption>
    </figure>`).join('');
  const sum = document.getElementById('gop-summary');
  sum.innerHTML = summaryHtml || '';

function gopToggle() {
  gopShowMask = document.getElementById('gop-toggle').checked;
  const key = gopShowMask ? 'mask' : 'orig';
  document.querySelectorAll('#gop-body figure img').forEach((img, idx) => {
    const it = gviPreviewItems[idx];
    if (it) img.src = it[key] || it.mask || it.orig;

  const lb = document.getElementById('gvi-lightbox');
  if (lb && lb.classList.contains('open') && lb.dataset.idx) {
    const it = gviPreviewItems[Number(lb.dataset.idx)];
    if (it) {
      document.getElementById('gvi-lightbox-img').src = it[key] || it.mask || it.orig;
      document.getElementById('gvi-lightbox-cap').textContent =

function gopCollapse() {

function openGviLightbox(idx) {

    ? ` · G${Math.round(it.pct.green)} S${Math.round(it.pct.sky)} B${Math.round(it.pct.built)}`

// ================================================================
// PNG export of overlay layers (built on demand from the stored
// source image + per-pixel class map). All respect transparency.
//   original  — the plain Street View image
//   composite — desaturated scene + colour washes (opaque, as shown)
//   green/sky/built — real-photo cutout of that class, transparent elsewhere
// ================================================================
function safeName(s) {
  return String(s == null ? 'view' : s)
    .replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').toLowerCase() || 'view';
}

function layerCanvas(item, layer) {
  const w = item.w, h = item.h, classMap = item.classMap, srcImg = item.srcImg;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (!srcImg) return c;
  ctx.drawImage(srcImg, 0, 0);
  if (layer === 'original') return c;

  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;
  if (layer === 'composite') {
    if (classMap) for (let p = 0; p < classMap.length; p++) maskPixel(d, p * 4, OVL_COLORS[classMap[p]]);
    ctx.putImageData(id, 0, 0);
    return c;
  }
  // Per-class cutout: keep real pixels for that class, transparent elsewhere
  const want = layer === 'green' ? 1 : layer === 'sky' ? 2 : 0; // built = 0
  if (classMap) for (let p = 0; p < classMap.length; p++) { if (classMap[p] !== want) d[p * 4 + 3] = 0; }
  ctx.putImageData(id, 0, 0);
  return c;
}

function canvasToBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

function triggerDownload(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function downloadCurrentLayer(layer) {
  const lb = document.getElementById('gvi-lightbox');
  const idx = Number(lb.dataset.idx);
  const item = gviPreviewItems[idx];
  if (!item) { showToast('No image selected', 'error'); return; }
  const blob = await canvasToBlob(layerCanvas(item, layer));
  triggerDownload(blob, `${idx + 1}_${safeName(item.label)}_${layer}.png`);
  showToast(`Downloaded ${layer}.png`, 'success');
}

async function downloadAllLayers() {
  if (!gviPreviewItems.length) { showToast('Nothing to download', 'info'); return; }
  try {
    showToast('Preparing ZIP…', 'info');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  } catch (e) { showToast('Could not load ZIP library', 'error'); return; }

  const zip = new JSZip();
  const layers = ['original', 'composite', 'green', 'sky', 'built'];
  for (let i = 0; i < gviPreviewItems.length; i++) {
    const item = gviPreviewItems[i];
    for (const layer of layers) {
      const blob = await canvasToBlob(layerCanvas(item, layer));
      zip.file(`${i + 1}_${safeName(item.label)}_${layer}.png`, blob);
    }
  }
  const content = await zip.generateAsync({ type: 'blob' });
  triggerDownload(content, `scene-composition-overlays-${new Date().toISOString().slice(0, 10)}.zip`);
  showToast('ZIP downloaded ✓', 'success');
}

function lbToggle() {

  cb.checked = !cb.checked;

}

// ================================================================
// Google Sheets (silent, fire-and-forget; one tab per module)
// ================================================================
function flattenForExport(obs) {
  const flat = {
    module: obs.module, timestamp: obs.timestamp, observer: obs.observer,
    confidence: obs.confidence, notes: obs.notes,
    lat: obs.lat, lng: obs.lng, heading: obs.heading, pitch: obs.pitch, zoom: obs.zoom,
    imageDate: obs.imageDate, backupDate: obs.backupDate, streetAddress: obs.streetAddress,
  };
  for (const [k, v] of Object.entries(obs.data || {})) {
    flat[k] = Array.isArray(v) ? v.join('; ') : v;
  }
  return flat;
}

function sendToSheet(obs) {
  const url = window.SHEETS_WEBHOOK_URL;
  if (!url || url === 'https://script.google.com/macros/s/AKfycbySEzVZDAFZwsRejLIk3cir6g1yApaKqYv8n-XWMHQITq-R0F2sImDuZjLOaGJaFYTI/exec') return;
  try {
    const params = new URLSearchParams({ data: JSON.stringify(flattenForExport(obs)) });
    fetch(`${url}?${params.toString()}`, { mode: 'no-cors' }).catch(() => {});
  } catch (e) { /* silent */ }
}

function resetForm() {

  document.getElementById('backupImageryDate').value = '';
  setConfidence(3);
  editingId = null;
  document.getElementById('edit-bar').classList.remove('visible');

  btn.innerHTML = 'Record <kbd>Ctrl+↵</kbd>';
}

function cancelEdit() {
  resetForm();
  showToast('Edit cancelled', 'info');
}

function saveObservation() {
  const mod  = getModule(currentModuleId);
  const data = collectFields(mod);

  const err = validateRequired(mod, data);
  if (err) { showToast(err, 'error'); return; }

  const pov = panorama ? panorama.getPov()      : { heading: 0, pitch: 0 };
  const pos = panorama ? panorama.getPosition() : null;
  const zoom = panorama && panorama.getZoom ? Math.round((panorama.getZoom() || 0) * 100) / 100 : '';

  const obs = {
    id:        editingId || Date.now().toString(),
    timestamp: editingId
                 ? (observations.find(o => o.id === editingId)?.timestamp || new Date().toISOString())
                 : new Date().toISOString(),
    module:    mod.id,
    observer:  document.getElementById('observer').value.trim(),
    confidence: parseInt(document.getElementById('confidence-value').value) || 3,
    notes:     document.getElementById('core-notes').value.trim(),
    lat:       pos ? pos.lat().toFixed(6) : '',
    lng:       pos ? pos.lng().toFixed(6) : '',
    heading:   Math.round(pov.heading),
    pitch:     Math.round(pov.pitch),
    zoom:      zoom,
    imageDate: document.getElementById('currentImageryDate').value,
    backupDate: document.getElementById('backupImageryDate').value.trim(),
    streetAddress: currentAddress,
    data,
  };

  if (editingId) {
    const idx = observations.findIndex(o => o.id === editingId);
    if (idx >= 0) observations[idx] = obs;
    showToast('Observation updated ✓', 'success');
  } else {
    observations.push(obs);
    sendToSheet(obs);
    showToast('Observation recorded ✓', 'success');
  }

  persistObs();
  renderObsList();
  updateObservationCount();
  resetForm();
}

function editObservation(id) {
  const obs = observations.find(o => o.id === id);
  if (!obs) return;

  // Switch to the observation's module first
  if (obs.module !== currentModuleId) {
    currentModuleId = obs.module;
    renderModuleSelect();
    renderForm();
  }

  editingId = id;
  const mod = getModule(obs.module);
  setFields(mod, obs.data || {});
  document.getElementById('core-notes').value          = obs.notes      || '';
  document.getElementById('currentImageryDate').value  = obs.imageDate  || '';
  document.getElementById('backupImageryDate').value   = obs.backupDate || '';
  setConfidence(obs.confidence || 3);
  document.getElementById('edit-bar').classList.add('visible');
  const btn = document.getElementById('save-btn');
  btn.className = 'btn btn-primary btn-full editing';
  btn.innerHTML = 'Update Observation <kbd>Ctrl+↵</kbd>';
  document.getElementById('tab-btn-form').click();
  const sb = document.querySelector('.sidebar-body');
  if (sb && typeof sb.scrollTo === 'function') sb.scrollTo({ top: 0, behavior: 'smooth' });
  showToast('Editing — update fields and click Update', 'warning');
}

function deleteObservation(id) {
  const obs = observations.find(o => o.id === id);
  const label = obs ? (obsSummary(obs)[0] || 'observation') : 'observation';
  if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;
  observations = observations.filter(o => o.id !== id);
  persistObs();
  renderObsList();
  updateObservationCount();
  if (editingId === id) resetForm();
  showToast('Observation deleted', 'info');
}

function clearAllData() {
  if (!observations.length) { showToast('Nothing to clear', 'info'); return; }
  if (!confirm(`Delete all ${observations.length} observation(s)? This cannot be undone.`)) return;
  observations = [];
  persistObs();
  resetForm();
  renderObsList();
  updateObservationCount();
  showToast('All data cleared', 'info');
}

// ================================================================
// Render observations list
// ================================================================
function obsSummary(obs) {
  const d = obs.data || {};
  switch (obs.module) {
    case 'urban-change':   return [d.feature, d.featurechange];
    case 'gvi': {
      const pickv = (a, b) => (a != null && a !== '') ? a : b;
      const mv   = pickv(d.manual_veg_pct, d.gviManual);
      const g    = pickv(d.green_view_pct, d.gviGreen);
      const s    = pickv(d.sky_view_pct,   d.gviSky);
      const b    = pickv(d.built_view_pct, d.gviBuilt);
      const mode = d.calc_mode || d.gviMode || '';
      const manual = (mv !== '' && mv != null) ? mv + '% veg (manual)' : '';
      const comp = (g !== '' && g != null)
        ? 'G ' + g + '% · S ' + s + '% · B ' + b + '%' + (mode ? ' (' + mode + ')' : '')
        : '';
      return [[manual, comp].filter(Boolean).join(' · ') || 'Scene composition',
              Array.isArray(d.vegTypes) ? d.vegTypes.join(', ') : (d.vegTypes || '')];
    }
    case 'perception':     return ['Safe ' + (d.safe || '—') + ' · Lively ' + (d.lively || '—') + ' · Beautiful ' + (d.beautiful || '—'),
                                  'Order ' + (d.order || '—') + ' · Maintained ' + (d.maintenance || '—') + ' · Inviting ' + (d.inviting || '—')];
    case 'scene-analysis': return [d.focalObject, [d.emplacement, d.timescene ? 'Timescene: ' + d.timescene : '']
                                  .filter(Boolean).join(' · ')];
    default: {
      const firstKeys = Object.keys(d).slice(0, 2);
      return [firstKeys.map(k => d[k]).filter(Boolean).join(' · ') || '(custom module)', ''];
    }
  }
}

function renderObsList() {
  const el = document.getElementById('obs-list');
  if (!observations.length) {
    el.innerHTML = '<div class="obs-empty">No observations yet</div>';
    return;
  }
  el.innerHTML = [...observations].reverse().map(obs => {
    const mod = getModule(obs.module);
    const [line1, line2] = obsSummary(obs);
    return `
    <div class="obs-item">
      <span class="obs-module">${esc(mod.name)}</span>
      <div class="obs-feature">${esc(line1 || '—')}</div>
      <div class="obs-change">${esc(line2 || '')}</div>
      <div class="obs-meta">
        ${esc(obs.imageDate || '—')} · conf. ${obs.confidence || '—'}/5${obs.observer ? ' · ' + esc(obs.observer) : ''}
      </div>
      <div class="obs-meta">${esc(obs.streetAddress || '—')}</div>
      <div class="obs-actions">
        <button class="btn btn-outline" style="font-size:0.72rem;padding:0.22rem 0.45rem"
          onclick="editObservation('${obs.id}')">Edit</button>
        <button class="btn btn-danger"
          onclick="deleteObservation('${obs.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ================================================================
// CSV export
// ================================================================
function csvRow(row) {
  return row.map(v => {
    const s = String(v == null ? '' : v);
    return /[,"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',');
}

function downloadCsv(lines, name) {
  const a    = document.createElement('a');
  a.href     = 'data:text/csv;charset=utf-8,' + encodeURIComponent(lines.join('\n'));
  a.download = name;
  a.click();
  showToast('CSV downloaded', 'success');
}

const CORE_COLS = ['module','timestamp','observer','confidence','notes',
                   'lat','lng','heading','pitch','zoom','imageDate','backupDate','streetAddress'];

function exportCsvModule() {
  const mod  = getModule(currentModuleId);
  const rows = observations.filter(o => o.module === mod.id);
  if (!rows.length) { showToast(`No observations for “${mod.name}”`, 'error'); return; }

  const schemaKeys = mod.fields.flatMap(f =>
    f.type === 'gvi' ? ['green_view_pct', 'sky_view_pct', 'built_view_pct', 'calc_mode', 'calc_method', 'calc_detail'] : [f.id]);
  const extraKeys = [...new Set(rows.flatMap(o => Object.keys(o.data || {})))]
    .filter(k => !schemaKeys.includes(k));
  const cols = [...CORE_COLS, ...schemaKeys, ...extraKeys];

  const lines = [csvRow(cols)];
  for (const obs of rows) {
    const flat = flattenForExport(obs);
    lines.push(csvRow(cols.map(c => flat[c] ?? '')));
  }
  downloadCsv(lines, `virtual-audit-${mod.id}-${new Date().toISOString().slice(0,10)}.csv`);
}

function exportCsvAll() {
  if (!observations.length) { showToast('No data to download', 'error'); return; }
  const cols = [...CORE_COLS, 'data'];
  const lines = [csvRow(cols)];
  for (const obs of observations) {
    const row = cols.map(c => c === 'data' ? JSON.stringify(obs.data || {}) : (obs[c] ?? ''));
    lines.push(csvRow(row));
  }
  downloadCsv(lines, `virtual-audit-all-${new Date().toISOString().slice(0,10)}.csv`);
}
