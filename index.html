function slugify(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'module';
}

function duplicateModule(id) {
  const src = getModule(id);
  const copy = JSON.parse(JSON.stringify(src));
  copy.name = src.name + ' (copy)';
  copy.id   = uniqueModuleId(slugify(copy.name));
  const customs = loadCustomModules();
  customs.push(copy);
  saveCustomModules(customs);
  renderManagerList();
}

function uniqueModuleId(base) {
  const ids = getAllModules().map(m => m.id);
  let id = base, n = 2;
  while (ids.includes(id)) id = base + '-' + (n++);
  return id;
}

function deleteCustomModule(id) {
  if (!confirm('Delete this custom module? Its saved observations are kept.')) return;
  saveCustomModules(loadCustomModules().filter(m => m.id !== id));
  if (currentModuleId === id) currentModuleId = 'urban-change';
  renderManagerList();
}

function exportModule(id) {
  const mod = loadCustomModules().find(m => m.id === id);
  if (!mod) return;
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mod, null, 2));
  a.download = `virtual-audit-module-${mod.id}.json`;
  a.click();
}

function importModulePrompt() {
  const json = prompt('Paste module JSON:');
  if (!json) return;
  try {
    const mod = JSON.parse(json);
    if (!mod.name || !Array.isArray(mod.fields)) throw new Error('Missing name or fields.');
    mod.id = uniqueModuleId(mod.id ? slugify(mod.id) : slugify(mod.name));
    const customs = loadCustomModules();
    customs.push(mod);
    saveCustomModules(customs);
    renderManagerList();
    showToast(`Module “${mod.name}” imported`, 'success');
  } catch (e) {
    alert('Invalid module JSON: ' + e.message);
  }
}

// ── Builder (create / edit a custom module) ──────────────────────
function openBuilder(id) {
  const existing = id ? loadCustomModules().find(m => m.id === id) : null;
  builderFields = existing ? JSON.parse(JSON.stringify(existing.fields)) : [];

  document.getElementById('modal-title').textContent = existing ? 'Edit Module' : 'New Module';
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div>
      <label>Module name <span class="req">*</span></label>
      <input type="text" id="builder-name" value="${escAttr(existing ? existing.name : '')}" placeholder="e.g. Bikeability Audit" />
    </div>
    <div>
      <label>Description</label>
      <textarea id="builder-desc" rows="2" placeholder="What does this instrument measure?">${esc(existing ? existing.description || '' : '')}</textarea>
    </div>
    <div class="subheading">Fields</div>
    <div id="builder-fields" style="display:flex;flex-direction:column;gap:0.45rem"></div>
    <button class="btn btn-outline" onclick="addBuilderField()">+ Add Field</button>
    <div style="display:flex;gap:0.4rem">
      <button class="btn btn-primary" style="flex:1" onclick="saveBuilder('${escAttr(id || '')}')">Save Module</button>
      <button class="btn btn-outline" style="flex:1" onclick="renderManagerList()">Cancel</button>
    </div>`;
  renderBuilderFields();
}

function addBuilderField() {
  builderFields.push({ id: '', label: '', type: 'text', options: [], required: false, section: '' });
  renderBuilderFields();
}

function removeBuilderField(i) {
  builderFields.splice(i, 1);
  renderBuilderFields();
}

function renderBuilderFields() {
  const wrap = document.getElementById('builder-fields');
  if (!wrap) return;
  syncBuilderFields(); // keep current edits before re-render
  wrap.innerHTML = builderFields.map((f, i) => `
    <div class="field-editor-row" data-bidx="${i}">
      <div>
        <label>Field label <span class="req">*</span></label>
        <input type="text" class="be-label" value="${escAttr(f.label)}" placeholder="e.g. Bike lane type" />
      </div>
      <div>
        <label>Type</label>
        <select class="be-type" onchange="syncBuilderFields();renderBuilderFields()">
          ${BUILDER_FIELD_TYPES.map(([v, n]) => `<option value="${v}" ${f.type === v ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="full" style="${['select','radio','checks','tags','bipolar'].includes(f.type) ? '' : 'display:none'}">
        <label>${f.type === 'bipolar' ? 'End labels (left | right)' : 'Options (comma-separated)'}</label>
        <input type="text" class="be-options"
          value="${escAttr((f.options || []).join(f.type === 'bipolar' ? ' | ' : ', '))}"
          placeholder="${f.type === 'bipolar' ? 'e.g. Unsafe | Safe' : 'e.g. Painted lane, Protected lane, None'}" />
      </div>
      <div class="full">
        <label>Section heading (optional — starts a new collapsible group above this field)</label>
        <input type="text" class="be-section" value="${escAttr(f.section || '')}" placeholder="e.g. Infrastructure" />
      </div>
      <div class="fe-foot">
        <label class="fe-req"><input type="checkbox" class="be-req" ${f.required ? 'checked' : ''}/> Required</label>
        <button class="btn btn-danger btn-sm" onclick="removeBuilderField(${i})">Remove</button>
      </div>
    </div>`).join('');
}

function syncBuilderFields() {
  document.querySelectorAll('#builder-fields .field-editor-row').forEach(row => {
    const i = Number(row.dataset.bidx);
    if (!builderFields[i]) return;
    const f = builderFields[i];
    f.label    = row.querySelector('.be-label').value;
    f.type     = row.querySelector('.be-type').value;
    f.section  = row.querySelector('.be-section').value.trim();
    f.required = row.querySelector('.be-req').checked;
    const optsInput = row.querySelector('.be-options');
    if (optsInput) {
      const sep = f.type === 'bipolar' ? '|' : ',';
      f.options = optsInput.value.split(sep).map(s => s.trim()).filter(Boolean);
    }
  });
}

function saveBuilder(existingId) {
  syncBuilderFields();
  const name = document.getElementById('builder-name').value.trim();
  if (!name) { alert('Module name is required.'); return; }
  const valid = builderFields.filter(f => f.label.trim());
  if (!valid.length) { alert('Add at least one field with a label.'); return; }

  // Assign stable field ids from labels
  const usedIds = new Set();
  for (const f of valid) {
    if (!f.id) f.id = slugify(f.label).replace(/-/g, '_');
    let base = f.id, n = 2;
    while (usedIds.has(f.id)) f.id = base + '_' + (n++);
    usedIds.add(f.id);
    if (f.type === 'slider') { f.min = 0; f.max = 100; f.step = 1; f.value = 0; }
    if (!f.section) delete f.section;
    if (!['select','radio','checks','tags','bipolar'].includes(f.type)) delete f.options;
  }

  const mod = {
    id: existingId || uniqueModuleId(slugify(name)),
    name,
    description: document.getElementById('builder-desc').value.trim(),
    fields: valid,
  };

  const customs = loadCustomModules();
  const idx = customs.findIndex(m => m.id === existingId);
  if (idx >= 0) customs[idx] = mod; else customs.push(mod);
  saveCustomModules(customs);
  currentModuleId = mod.id;
  renderManagerList();
  showToast(`Module “${mod.name}” saved`, 'success');
}

// ================================================================
// Geocoding / navigation
// ================================================================
function debouncedReverseGeocode(latLng) {
  clearTimeout(geocodeTimer);
  geocodeTimer = setTimeout(() => {
    geocoder.geocode({ location: latLng }, (results, status) => {
      if (status === 'OK' && results[0]) setAddressDisplay(results[0].formatted_address);
    });
  }, 600);
}

function navigateTo(latLng) {
  isUpdatingFromDate = true; // suppress position_changed → updateAvailableDates
  panorama.setPosition(latLng);
  miniMap.setCenter(latLng);
  debouncedReverseGeocode(latLng);
  updateAvailableDates(latLng);
  setTimeout(() => { isUpdatingFromDate = false; }, 1500);
}

function searchAddress() {
  const input = document.getElementById('address-input');
  const val   = input.value.trim();
  if (!val) return;

  // Support bare "lat, lng" input
  const coordMatch = val.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
  if (coordMatch) {
    navigateTo(new google.maps.LatLng(parseFloat(coordMatch[1]), parseFloat(coordMatch[2])));
    input.value = '';
    return;
  }

  const btn = document.getElementById('search-btn');
  btn.textContent = '…';
  btn.disabled = true;
  geocoder.geocode({ address: val }, (results, status) => {
    btn.textContent = 'Go';
    btn.disabled = false;
    if (status === 'OK' && results[0]) {
      navigateTo(results[0].geometry.location);
      setAddressDisplay(results[0].formatted_address);
      input.value = '';
    } else {
      showToast('Location not found', 'error');
    }
  });
}

// ================================================================
// Date handling
// (hybrid: uses time[].description where available, otherwise
//  fetches each historical pano's imageDate — robust across
//  Maps API versions where .description is unreliable)
// ================================================================
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function fmtImageDate(imageDate) {
  if (!imageDate) return null;
  const m = String(imageDate).match(/(\d{4})-(\d{2})/);
  return m ? MONTHS[parseInt(m[2]) - 1] + ' ' + m[1] : String(imageDate);
}
function labelOrdinal(label) {
  // Accepts "May 2019" or "2019-05"
  const ym = String(label || '').match(/(\d{4})-(\d{2})/);
  if (ym) return parseInt(ym[1]) * 12 + parseInt(ym[2]);
  const p = String(label || '').trim().split(' ');
  const mi = MONTHS.indexOf(p[0]);
  return parseInt(p[1] || 0) * 12 + (mi >= 0 ? mi + 1 : 0);
}

function dateSelectChangeHandler() {
  const sel = document.getElementById('imageDate');
  if (!sel.value) return;
  const label = sel.options[sel.selectedIndex].text;
  isUpdatingFromDate = true;
  panorama.setPano(sel.value);
  setCurrentDateDisplay(label);
  setTimeout(() => { isUpdatingFromDate = false; }, 900);
}

function updateAvailableDates(location) {
  const sel = document.getElementById('imageDate');
  sel.innerHTML = '<option value="">Loading dates…</option>';
  setCurrentDateDisplay('');

  function populate(items) {
    // items: [{ pano, label }]
    const valid = items
      .filter(i => i.pano && i.label)
      .sort((a, b) => labelOrdinal(a.label) - labelOrdinal(b.label));

    if (!valid.length) {
      sel.innerHTML = '<option value="">No dated panoramas found</option>';
      return;
    }
    sel.innerHTML = valid
      .map(i => `<option value="${i.pano}">${esc(i.label)}</option>`)
      .join('');
    sel.selectedIndex = valid.length - 1;

    const latest = valid[valid.length - 1];
    isUpdatingFromDate = true;
    panorama.setPano(latest.pano);
    setCurrentDateDisplay(latest.label);
    setTimeout(() => { isUpdatingFromDate = false; }, 900);
  }

  // Step 1: location → current pano ID
  streetViewService.getPanorama(
    { location, radius: 50, source: google.maps.StreetViewSource.OUTDOOR },
    (locData, locStatus) => {
      if (locStatus !== google.maps.StreetViewStatus.OK) {
        sel.innerHTML = '<option value="">No Street View at this location</option>';
        return;
      }
      const currentPanoId = locData.location.pano;

      // Step 2: current pano ID → time[] (historical pano IDs)
      streetViewService.getPanorama({ pano: currentPanoId }, (data, status) => {
        if (status !== google.maps.StreetViewStatus.OK || !data) {
          populate([{ pano: currentPanoId, label: fmtImageDate(locData.imageDate) || 'Current' }]);
          return;
        }
        const times = data.time || [];
        if (!times.length) {
          populate([{ pano: currentPanoId, label: fmtImageDate(data.imageDate) || 'Current' }]);
          return;
        }

        // Fast path: time[] entries carry usable descriptions ("May 2019")
        if (times.every(t => t.pano && t.description)) {
          populate(times.map(t => ({ pano: t.pano, label: t.description })));
          return;
        }

        // Robust path: fetch each historical pano's imageDate ("YYYY-MM")
        const results = [];
        let pending = times.length;
        times.forEach(t => {
          const pid = t.pano;
          if (!pid) { if (!--pending) populate(results); return; }
          streetViewService.getPanorama({ pano: pid }, (d, s) => {
            if (s === google.maps.StreetViewStatus.OK && d?.imageDate) {
              results.push({ pano: pid, label: fmtImageDate(d.imageDate) });
            }
            if (!--pending) populate(results);
          });
        });
      });
    }
  );
}

function syncDateSelector() {
  if (isUpdatingFromDate) return;
  const panoId = panorama.getPano();
  const sel    = document.getElementById('imageDate');
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === panoId) {
      sel.selectedIndex = i;
      setCurrentDateDisplay(sel.options[i].text);
      return;
    }
  }
}

// ================================================================
// Observer persistence
// ================================================================
function loadSavedObserver() {
  const saved = localStorage.getItem(OBSERVER_KEY);
  if (saved) document.getElementById('observer').value = saved;
  document.getElementById('observer').addEventListener('blur', e => {
    if (e.target.value.trim()) {
      try { localStorage.setItem(OBSERVER_KEY, e.target.value.trim()); } catch (err) {}
    }
  });
}

// ================================================================
// Keyboard shortcuts
// ================================================================
document.addEventListener('keydown', e => {
  // Ctrl/Cmd + Enter → Record / Update
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    saveObservation();
  }
  // Escape → Cancel edit / close modal
  if (e.key === 'Escape') {
    if (document.getElementById('modal-backdrop').classList.contains('open')) closeManager();
    else if (editingId !== null) cancelEdit();
  }
});

// ================================================================
// Google Maps init (called by Maps API callback)
// ================================================================
function initMap() {
  geocoder          = new google.maps.Geocoder();
  streetViewService = new google.maps.StreetViewService();

  const defaultLatLng = new google.maps.LatLng(49.8875, -119.4961); // Bernard Ave, Kelowna

  panorama = new google.maps.StreetViewPanorama(
    document.getElementById('pano'),
    {
      position:              defaultLatLng,
      pov:                   { heading: 165, pitch: 0 },
      zoom:                  1,
      addressControl:        false,
      fullscreenControl:     false,
      motionTracking:        false,
      motionTrackingControl: false,
      imageDateControl:      false,
    }
  );

  miniMap = new google.maps.Map(document.getElementById('map'), {
    center:             defaultLatLng,
    zoom:               17,
    disableDefaultUI:   true,
    zoomControl:        true,
    streetViewControl:  true,   // pegman — drag onto a street to move the panorama
    mapTypeControl:     false,
    fullscreenControl:  false,
    zoomControlOptions:       { position: google.maps.ControlPosition.LEFT_BOTTOM },
    streetViewControlOptions: { position: google.maps.ControlPosition.RIGHT_TOP },
  });
  miniMap.setStreetView(panorama); // pegman tracks the panorama

  // Hide loading overlay once pano tiles start rendering
  panorama.addListener('tiles_loaded', () => {
    document.getElementById('pano-loading').classList.add('hidden');
  });

  // Sync panorama position → mini-map; refresh dates (debounced) when
  // the user navigates manually
  panorama.addListener('position_changed', () => {
    const pos = panorama.getPosition();
    if (!pos) return;
    miniMap.setCenter(pos);
    if (!isUpdatingFromDate) {
      debouncedReverseGeocode(pos);
      clearTimeout(datesTimer);
      datesTimer = setTimeout(() => updateAvailableDates(pos), 700);
    }
  });

  // Track pano changes for date display (user navigating manually)
  panorama.addListener('pano_changed', syncDateSelector);

  // Click on mini-map → navigate panorama
  miniMap.addListener('click', e => navigateTo(e.latLng));

  // Enter key in address input
  document.getElementById('address-input')
    .addEventListener('keydown', e => { if (e.key === 'Enter') searchAddress(); });

  // Initialise dates for default location
  updateAvailableDates(defaultLatLng);
  debouncedReverseGeocode(defaultLatLng);
}

// ================================================================
// Boot (independent of Maps API)
// ================================================================
observations = loadObs();
renderModuleSelect();
renderForm();
renderObsList();
updateObservationCount();
setConfidence(3);
loadSavedObserver();

// ================================================================
// Load Google Maps API
// ================================================================
(function() {
  const s   = document.createElement('script');
  s.async   = true;
  s.src     = 'https://maps.googleapis.com/maps/api/js?key='
              + encodeURIComponent(window.MAPS_API_KEY || '')
              + '&callback=initMap&v=weekly&loading=async';
  s.onerror = () => showToast('Failed to load Google Maps — check your API key', 'error');
  document.head.appendChild(s);
})();
</script>
